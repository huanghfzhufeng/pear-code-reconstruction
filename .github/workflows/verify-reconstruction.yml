name: Verify reconstruction
on:
  pull_request:
  workflow_dispatch:
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: node scripts/test-frame-refresh.mjs
      - run: node scripts/test-dev-isolation.mjs
