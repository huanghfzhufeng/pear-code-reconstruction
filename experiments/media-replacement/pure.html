<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纯代码金属梨 · 无图像输入</title><link rel="stylesheet" href="lab.css"></head><body><main><header><a href="./">返回代码替代实验</a><span>0 张图片 · 0 段视频</span></header><section><h1>浏览器直接画出这个梨。</h1><p>形体、表面凹凸、金色与光照由代码计算。本页不加载图片、视频或原站纹理。</p><canvas id="pear" width="800" height="600" style="max-width:800px" role="img" aria-label="由代码实时绘制的金属梨"></canvas><label class="slider">旋转角度<input id="angle" type="range" min="0" max="1000" value="0"></label><p>仍缺少原站的人物、绘画细节和完整场景，不能当作整站替代成功。</p></section></main><script type="module">import{proceduralPear}from'./pear.js';try{const draw=proceduralPear(document.querySelector('#pear'));draw(0);window.__purePear={draw};document.querySelector('#angle').oninput=e=>draw(Number(e.target.value)/1000);}catch(e){document.body.append(document.createTextNode(e.message));throw e;}</script></body></html>
